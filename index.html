<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayazit Chart-Schule</title>
<meta name="description" content="Charts lesen lernen: Kerzen, Muster, Trendlinien, Indikatoren und Risiko – mit animierten Erklär-Videos und Quiz.">
<meta name="theme-color" content="#05080d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080d; --panel:#0b1118; --card:#0f1620; --line:#1b2532; --text:#dfe6ef; --mute:#7f8b9c;
  --up:#1fcf8f; --down:#f0605d; --gold:#f5c542; --blue:#4c9aff; --purple:#b388ff;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:rgba(5,8,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;flex:none}
.brand{font-family:var(--mono);font-weight:800;letter-spacing:.06em;font-size:15px;line-height:1.15}
.brand small{display:block;color:var(--mute);font-weight:500;font-size:11px;letter-spacing:.12em}
.prog{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mute);text-align:right}
.bar{width:110px;height:5px;background:var(--line);border-radius:9px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--up),var(--gold));width:0;transition:width .4s}
main{display:grid;grid-template-columns:330px 1fr;max-width:1280px;margin:0 auto;min-height:calc(100vh - 60px)}
#nav{border-right:1px solid var(--line);padding:14px 12px 40px;height:calc(100vh - 60px);overflow:auto;position:sticky;top:60px}
#search{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:15px;outline:none}
#search:focus{border-color:var(--gold)}
.cat{margin:18px 4px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.cat::after{content:"";flex:1;height:1px;background:var(--line)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:9px 8px;margin:2px 0}
.item:hover{background:var(--card)}
.item.on{background:var(--card);border-color:#2a3647}
.item .ic{width:36px;height:36px;flex:none;border-radius:8px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.item b{display:block;font-size:14.5px;font-weight:600}
.item span{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.item .ok{margin-left:auto;color:var(--up);font-size:14px;opacity:0}
.item.seen .ok{opacity:1}
#view{padding:18px 22px 60px;min-width:0}
.back{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:14px;margin-bottom:12px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
h1{font-family:var(--mono);font-weight:800;letter-spacing:.03em;font-size:clamp(24px,4.4vw,36px);margin:4px 0 4px;text-transform:uppercase}
.lead{color:#b9c4d2;margin:0 0 14px;font-size:15.5px;line-height:1.5;max-width:760px}
.player{background:#020407;border:1px solid var(--line);border-radius:16px;overflow:hidden;max-width:900px}
.cwrap{position:relative;cursor:pointer}
canvas{display:block;width:100%}
.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .25s}
.overlay.show{opacity:1}
.overlay div{background:rgba(5,8,13,.75);border:1px solid #2a3647;border-radius:999px;padding:12px 18px;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.06em}
.caption{padding:12px 16px 4px;min-height:74px;border-top:1px solid var(--line)}
.caption .no{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.14em}
.caption p{margin:5px 0 0;font-size:15.5px;line-height:1.45;transition:opacity .25s}
.ctrl{display:flex;align-items:center;gap:8px;padding:8px 12px 12px}
.cb{background:var(--card);border:1px solid var(--line);border-radius:9px;min-width:40px;height:38px;padding:0 10px;font-family:var(--mono);font-size:14px;font-weight:700}
.cb:hover{border-color:#36465b}
#seek{flex:1;accent-color:#ef4444;height:28px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 14px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip.done{color:var(--text)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:16px;max-width:900px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box h3{margin:0 0 8px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.box p,.box li{font-size:14.5px;line-height:1.5;color:#c9d2de;margin:0}
.box ul{margin:0;padding-left:18px}.box li{margin:3px 0}
.box.g h3{color:var(--up)}.box.y h3{color:var(--gold)}.box.b h3{color:var(--blue)}.box.r h3{color:var(--down)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:18px;max-width:900px}
.pn button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;font-size:14px}
.pn button:last-child{text-align:right}
.pn small{display:block;color:var(--mute);font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;margin-bottom:3px}
.pn button:disabled{opacity:.35;cursor:default}
.disc{color:var(--mute);font-size:12px;margin-top:22px;max-width:900px}
.home{max-width:900px}
.home .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left}
.tile:hover{border-color:#36465b}
.tile b{display:block;font-family:var(--mono);font-size:14px;letter-spacing:.05em;text-transform:uppercase;margin:10px 0 4px}
.tile span{color:var(--mute);font-size:13px}
.quizbtn{background:linear-gradient(90deg,rgba(245,197,66,.12),transparent);border-color:#3a3320 !important;margin-top:12px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:760px}
.qbar{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}.qbar i{display:block;height:100%;background:var(--gold)}
.qq{font-size:18px;font-weight:700;line-height:1.4;margin:0 0 12px}
.qcv{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:#020407}
.opts{display:grid;gap:8px}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;font-size:15.5px}
.opt:hover:not(:disabled){border-color:#3a4a60}
.opt.ok{border-color:var(--up);background:rgba(31,207,143,.12)}
.opt.bad{border-color:var(--down);background:rgba(240,96,93,.12)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14.5px;line-height:1.5}
.fb b{font-family:var(--mono)}
.qnav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.qnav button{flex:1;min-width:140px;border-radius:12px;padding:12px;font-weight:700;border:1px solid var(--line);background:var(--panel)}
.qnav .main{background:var(--gold);color:#1b1505;border-color:var(--gold)}
.score{font-family:var(--mono);font-size:54px;font-weight:800;margin:6px 0}
.calc{margin-top:12px;max-width:900px}
.calc .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:8px 0 12px}
.calc label{font-size:12px;color:var(--mute);font-family:var(--mono);letter-spacing:.06em}
.calc input{width:100%;margin-top:4px;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:16px}
.calc .res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.calc .res div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.calc .res span{display:block;font-size:11.5px;color:var(--mute);font-family:var(--mono)}
.calc .res b{font-family:var(--mono);font-size:18px}
.bigtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-top:18px}
.big{position:relative;overflow:hidden;text-align:left;background:linear-gradient(160deg,var(--card),#0a0f15);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;min-height:168px;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.big:hover{transform:translateY(-2px);border-color:var(--acc)}
.big::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--acc)}
.big::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%)}
.big .bi{position:absolute;right:14px;top:16px;opacity:.95}
.big h2{font-family:var(--mono);font-weight:800;font-size:clamp(17px,1.6vw + 6px,21px);letter-spacing:.03em;text-transform:uppercase;margin:0 70px 8px 0;line-height:1.2;color:var(--acc)}
.big p{margin:0 0 14px;color:#b9c4d2;font-size:14.5px;line-height:1.45;max-width:85%}
.big .ft{margin-top:auto;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.big .pb{flex:1;height:5px;background:var(--line);border-radius:9px;overflow:hidden}.big .pb i{display:block;height:100%;background:var(--acc)}
.big .go{color:var(--acc);font-size:16px;font-weight:800}
.lcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:16px}
.lc{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lc:hover{border-color:var(--acc)}
.lc .ic{width:48px;height:48px;flex:none;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.lc small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--mute)}
.lc b{display:block;font-size:16px;margin:2px 0}
.lc span{display:block;font-size:13px;color:var(--mute)}
.lc .ok{margin-left:auto;color:var(--up);font-size:18px}
.start{margin-top:16px;background:var(--up);color:#03140d;border:0;border-radius:12px;padding:13px 20px;font-weight:800;font-size:15px}
@media (max-width:860px){
  main{grid-template-columns:1fr}
  #nav{position:static;height:auto;border-right:0;padding:12px 14px 40px}
  #view{padding:14px 12px 50px}
  #nav{display:none}
  .bar{width:70px}
}
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 34 34"><rect width="34" height="34" rx="8" fill="#0f1620"/><line x1="10" y1="6" x2="10" y2="27" stroke="#f0605d" stroke-width="2"/><rect x="6.5" y="11" width="7" height="10" fill="#f0605d" rx="1"/><line x1="23" y1="5" x2="23" y2="29" stroke="#1fcf8f" stroke-width="2"/><rect x="19.5" y="9" width="7" height="14" fill="#1fcf8f" rx="1"/></svg>
  <div class="brand" style="cursor:pointer" onclick="location.hash=''">CHART-SCHULE<small>BAYAZIT · CHARTS VERSTEHEN</small></div>
  <div class="prog"><span id="progtxt">0 / 0</span><div class="bar"><i id="progbar"></i></div></div>
</header>
<main>
  <nav id="nav">
    <input id="search" placeholder="Lektion suchen … z. B. Hammer" autocomplete="off">
    <div id="list"></div>
  </nav>
  <section id="view"></section>
</main>
<script>
"use strict";
/* ============ Farben & Helfer ============ */
const C={bg:'#020407',grid:'#111a24',axis:'#6f7b8c',up:'#1fcf8f',down:'#f0605d',text:'#e6ecf3',gold:'#f5c542',blue:'#4c9aff',purple:'#b388ff',orange:'#ff9f43',mute:'#7f8b9c'};
const MONO="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace";
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const fmt=(p,dig=1)=>p.toFixed(dig).replace('.',',');
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}

/* Kerzen aus Eckpunkten erzeugen */
function build(keys,opt={}){
  const n=keys[keys.length-1][0]+1,r=rng(opt.seed||11),noise=opt.noise??0.5,wick=opt.wick??0.7,set=opt.set||{};
  const keyIdx=new Set(keys.map(k=>k[0])),cl=[];
  for(let i=0;i<n;i++){
    let k=0;while(k<keys.length-2&&keys[k+1][0]<=i)k++;
    const a=keys[k],b=keys[k+1];
    let v=b[0]===a[0]?a[1]:a[1]+(b[1]-a[1])*(i-a[0])/(b[0]-a[0]);
    if(!keyIdx.has(i))v+=(r()-.5)*2*noise;
    if(set[i])v=set[i].c;
    cl.push(v);
  }
  const d=[];
  for(let i=0;i<n;i++){
    const s=set[i]||{};
    const o=s.o!=null?s.o:(i?cl[i-1]:cl[0]-(r()-.3)*noise*2),c=cl[i],body=Math.abs(c-o);
    const h=s.h!=null?s.h:Math.max(o,c)+r()*wick*(.4+body*.15);
    const l=s.l!=null?s.l:Math.min(o,c)-r()*wick*(.4+body*.15);
    const vol=(30+r()*25+body*6)*((opt.vol&&opt.vol[i])||1);
    d.push({o,h,l,c,v:vol});
  }
  return d;
}
const smaCalc=(d,n)=>d.map((_,i)=>i<n-1?null:d.slice(i-n+1,i+1).reduce((s,c)=>s+c.c,0)/n);
function rsiCalc(d,n=14){const out=Array(d.length).fill(null);let g=0,l=0;
  for(let i=1;i<d.length;i++){const ch=d[i].c-d[i-1].c,up=Math.max(ch,0),dn=Math.max(-ch,0);
    if(i<=n){g+=up;l+=dn;if(i===n){g/=n;l/=n;out[i]=l===0?100:100-100/(1+g/l);}}
    else{g=(g*(n-1)+up)/n;l=(l*(n-1)+dn)/n;out[i]=l===0?100:100-100/(1+g/l);}}
  return out;}

/* ============ Lektionen ============ */
const CATS={basis:'Grundlagen',kerzen:'Kerzenmuster',formation:'Chartformationen',tools:'Indikatoren & Werkzeuge',risiko:'Risiko & Praxis'};
const LESSONS=[];
const add=o=>LESSONS.push(o);
const hiR=(d,a,b)=>Math.max(...d.slice(a,b+1).map(c=>c.h)), loR=(d,a,b)=>Math.min(...d.slice(a,b+1).map(c=>c.l));

/* ---- GRUNDLAGEN ---- */
add({id:'kerze',cat:'basis',title:'Die Kerze',sub:'Aufbau einer Kerze: Körper, Docht, Hoch, Tief',icon:'anat',custom:'anatomy',
 lead:'Jede Kerze erzählt, was der Preis in einem bestimmten Zeitraum gemacht hat – zum Beispiel in einer Stunde. Schau zu, wie eine Kerze live entsteht.',
 steps:[
  {at:0,text:'Eine Kerze fasst einen Zeitraum zusammen – hier eine Stunde: von 10:00 bis 11:00 Uhr.'},
  {at:900,text:'10:00 Uhr: Der erste Preis ist die ERÖFFNUNG. Der weiße Punkt ist der aktuelle Preis – er schwankt hoch und runter …'},
  {at:7200,text:'11:00 Uhr: Die Stunde ist vorbei. Der letzte Preis ist der SCHLUSS. Der höchste Preis ist das HOCH, der tiefste das TIEF.'},
  {at:9300,text:'Der dicke Teil ist der KÖRPER (von Eröffnung bis Schluss). Die dünnen Linien heißen DOCHT oder Schatten.'},
  {at:11300,text:'Schluss über Eröffnung → GRÜNE Kerze (bullisch): Die Käufer haben gewonnen.'},
  {at:13300,text:'Nächste Stunde (11:00–12:00): Diesmal fällt der Kurs …'},
  {at:19600,text:'Schluss unter Eröffnung → ROTE Kerze (bärisch). Achtung: Bei Rot ist die Eröffnung OBEN und der Schluss UNTEN!'}
 ],total:24500,
 box:{was:'Die Kerze (Candlestick) zeigt vier Preise eines Zeitraums: Eröffnung, Hoch, Tief und Schluss – kurz OHLC (Open, High, Low, Close).',
  erkennen:['Grün: Schluss liegt über der Eröffnung (Kurs gestiegen)','Rot: Schluss liegt unter der Eröffnung (Kurs gefallen)','Körper = Eröffnung bis Schluss, Dochte = Ausreißer bis Hoch und Tief'],
  bedeutung:'Großer Körper = eine Seite hatte klar die Kontrolle. Lange Dochte = der Preis wurde an dieser Stelle stark zurückgewiesen.',
  tipp:'Jede Zeiteinheit hat eigene Kerzen: 1 Minute, 1 Stunde, 1 Tag … Eine Tageskerze besteht aus 24 Stundenkerzen.'}});

add({id:'trend',cat:'basis',title:'Trend erkennen',sub:'Höhere Hochs und höhere Tiefs',icon:'trend',
 make(){const d=build([[0,100],[6,110],[10,104],[16,116],[20,109],[26,123],[30,115],[36,130]],{seed:3,noise:.45});
  const H=i=>d[i].h,L=i=>d[i].l;
  return{data:d,steps:[
   {to:7,text:'Der Kurs steigt bis zu einem ersten Hoch.',ov:[{t:'mark',i:6,p:H(6),text:'H',col:C.up}]},
   {to:11,text:'Dann ein Rücksetzer – es entsteht ein Tief.',ov:[{t:'mark',i:10,p:L(10),text:'T',col:C.down,pos:'below'}]},
   {to:21,text:'Das nächste Hoch ist HÖHER (HH) und auch das nächste Tief ist HÖHER (HT).',ov:[{t:'mark',i:16,p:H(16),text:'HH',col:C.up},{t:'mark',i:20,p:L(20),text:'HT',col:C.gold,pos:'below'}]},
   {to:37,text:'Eine Treppe aus höheren Hochs und höheren Tiefs = AUFWÄRTSTREND.',ov:[{t:'mark',i:26,p:H(26),text:'HH',col:C.up},{t:'mark',i:30,p:L(30),text:'HT',col:C.gold,pos:'below'},
     {t:'path',pts:[[0,d[0].l],[6,H(6)],[10,L(10)],[16,H(16)],[20,L(20)],[26,H(26)],[30,L(30)],[36,H(36)]],col:C.blue}],hold:600}]};},
 box:{was:'Ein Trend ist die Hauptrichtung des Kurses. Es gibt Aufwärtstrend, Abwärtstrend und Seitwärtsphase.',
  erkennen:['Aufwärtstrend: höhere Hochs (HH) und höhere Tiefs (HT)','Abwärtstrend: tiefere Hochs und tiefere Tiefs','Seitwärts: Hochs und Tiefs etwa auf gleicher Höhe'],
  bedeutung:'„The trend is your friend“: Trades in Trendrichtung haben meist bessere Chancen als Trades dagegen.',
  tipp:'Der Trend ist erst gebrochen, wenn ein höheres Tief unterschritten wird – nicht bei jeder roten Kerze.'}});

add({id:'unterstuetzung',cat:'basis',title:'Unterstützung & Widerstand',sub:'Preiszonen, an denen der Kurs abprallt',icon:'sr',
 make(){const d=build([[0,105],[4,110],[9,100],[14,110],[19,100.5],[24,109.8],[29,101],[34,112],[38,118]],{seed:5,noise:.4,wick:.5});
  return{data:d,steps:[
   {to:15,text:'Der Kurs prallt mehrmals an denselben Preisen ab.'},
   {text:'Oben bremst der WIDERSTAND: Hier verkaufen viele Marktteilnehmer.',ov:[{t:'h',p:110,col:C.down,label:'WIDERSTAND',to:38}]},
   {text:'Unten hält die UNTERSTÜTZUNG: Hier kaufen viele.',ov:[{t:'h',p:100,col:C.up,label:'UNTERSTÜTZUNG',to:38}]},
   {to:30,text:'Je öfter eine Zone hält, desto wichtiger wird sie.',ov:[{t:'label',i:19,p:d[19].l,text:'3. Test',col:C.up,pos:'below'},{t:'label',i:24,p:d[24].h,text:'3. Test',col:C.down}]},

function prepare(L){
 if(L.custom){L.data=null;return;}
 if(!L.data){const m=L.make();L.data=m.data;L.steps=m.steps;}
 const d=L.data;let lo=Math.min(...d.map(c=>c.l)),hi=Math.max(...d.map(c=>c.h));
 const take=p=>{if(p!=null&&isFinite(p)){lo=Math.min(lo,p);hi=Math.max(hi,p);}};
 L.steps.forEach(s=>(s.ov||[]).forEach(o=>{
  if(o.t==='line'){take(o.a[1]);take(o.b[1]);const sl=(o.b[1]-o.a[1])/(o.b[0]-o.a[0]);take(o.b[1]+sl*(o.ext||0));}
  if(o.t==='arrow'){take(o.a[1]);take(o.b[1]);}
  if(o.t==='h')take(o.p);
  if(o.t==='pos'){take(o.entry);take(o.stop);take(o.target);}
  if(o.t==='fib'){take(o.p1);take(o.p2);}
  if(o.t==='sma')o._s=smaCalc(d,o.n);
  if(o.t==='cross'){const f=smaCalc(d,o.f),s=smaCalc(d,o.s);o._f=f;o._i=-1;
    for(let i=o.s;i<d.length;i++){if(f[i-1]!=null&&s[i-1]!=null&&f[i-1]<=s[i-1]&&f[i]>s[i]){o._i=i;o._p=f[i];break;}}}
 }));
 L.lo=lo;L.hi=hi;
 if(L.panel==='rsi')L.rsi=rsiCalc(d);
}
function buildTL(L){
 const tl={steps:[],cseg:[],ovs:[],total:0};
 if(L.custom){tl.steps=L.steps.map(s=>({t:s.at,text:s.text}));tl.total=L.total;return tl;}
 let T=350,shown=0;const n=L.data.length;
 L.steps.forEach((s,si)=>{
  tl.steps.push({t:T,text:s.text});
  if(s.to!=null&&s.to>shown){const d=Math.max(450,(s.to-shown)*95);tl.cseg.push({t0:T,t1:T+d,from:shown,to:s.to});T+=d;shown=s.to;}
  (s.ov||[]).forEach(o=>{const d=o.t==='fib'?1800:(['line','h','arrow','sma','path','pos'].includes(o.t)?1000:480);tl.ovs.push({o,t0:T,t1:T+d});T+=d+140;});
  T+=s.hold??2300;
 });
 tl.total=T;return tl;
}
function visibleAt(t){let v=0;for(const s of P.tl.cseg){if(t>=s.t1)v=s.to;else if(t>=s.t0)v=s.from+(s.to-s.from)*(t-s.t0)/(s.t1-s.t0);}return v;}

let Q=null;
function startQuiz(){
 current=null;P.L=null;P.cv=null;
 const pics=shuffle(LESSONS.filter(l=>l.cat==='kerzen'||l.cat==='formation')).slice(0,4).map(L=>{
  const others=shuffle(LESSONS.filter(l=>l.cat===L.cat&&l.id!==L.id)).slice(0,3).map(l=>l.title);
  return{pic:L,q:L.cat==='kerzen'?'Welches Kerzenmuster ist markiert?':'Welche Chartformation siehst du?',opts:shuffle([L.title,...others]),ans:L.title,e:L.box.was,l:L.id};});
 const txt=shuffle(TQ.slice()).slice(0,6).map(x=>({q:x.q,opts:shuffle(x.a.slice()),ans:x.a[0],e:x.e,l:x.l}));
 Q={list:shuffle([...pics,...txt]),i:0,score:0,wrong:[]};renderList();renderQ();
}
function renderQ(){
 const it=Q.list[Q.i],n=Q.list.length;
 view.innerHTML=`<button class="back" id="back">‹ Startseite</button>
 <div class="kicker">Quiz · Frage ${Q.i+1} von ${n} · ${Q.score} richtig</div><h1>Teste dein Wissen</h1>
 <div class="qcard"><div class="qbar"><i style="width:${Q.i/n*100}%"></i></div>
 <p class="qq">${it.q}</p>${it.pic?'<div class="qcv"><canvas id="qcv"></canvas></div>':''}
 <div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}">${String.fromCharCode(65+k)}) ${o}</button>`).join('')}</div>
 <div id="fb"></div></div>`;
 document.getElementById('back').onclick=()=>{location.hash='';};
 if(it.pic)drawStatic(document.getElementById('qcv'),it.pic);
 view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));window.scrollTo(0,0);
}
function answer(k){
 const it=Q.list[Q.i],ok=it.opts[k]===it.ans;if(ok)Q.score++;else Q.wrong.push(it.l);
 view.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(it.opts[j]===it.ans)b.classList.add('ok');else if(j===k)b.classList.add('bad');});
 const last=Q.i===Q.list.length-1,L=LESSONS.find(x=>x.id===it.l);
 document.getElementById('fb').innerHTML=`<div class="fb"><b style="color:${ok?'var(--up)':'var(--down)'}">${ok?'✓ RICHTIG!':'✗ LEIDER FALSCH'}</b>${ok?'':` – richtig ist: <b>${it.ans}</b>`}<br>${it.e}</div>
 <div class="qnav"><button id="tol">📖 Lektion: ${L?L.title:''}</button><button class="main" id="nx">${last?'Ergebnis ansehen':'Weiter ›'}</button></div>`;
 document.getElementById('tol').onclick=()=>location.hash=it.l;
 document.getElementById('nx').onclick=()=>{if(last)renderResult();else{Q.i++;renderQ();}};
}
function renderResult(){
 const n=Q.list.length,sc=Q.score;if(sc>best){best=sc;try{localStorage.setItem('cs-best',best)}catch(e){}}renderList();
 const msg=sc===n?'Perfekt! Du bist ein echter Chart-Profi. 🏆':sc>=8?'Sehr stark! Fast alles richtig. 💪':sc>=5?'Gut! Ein paar Lektionen kannst du noch wiederholen.':'Nicht schlimm – schau dir die Lektionen unten nochmal an und versuch es erneut.';
 const rep=[...new Set(Q.wrong)].map(id=>LESSONS.find(l=>l.id===id)).filter(Boolean);
 view.innerHTML=`<button class="back" id="back">‹ Startseite</button><div class="kicker">Quiz · Ergebnis</div><h1>Geschafft!</h1>

 ${rep.length?`<p style="margin:16px 0 6px;font-weight:700">Diese Lektionen solltest du wiederholen:</p><div class="opts">${rep.map(l=>`<button class="opt" data-id="${l.id}">📖 ${l.title}</button>`).join('')}</div>`:''}
 <div class="qnav"><button id="home">Zur Übersicht</button><button class="main" id="again">🎯 Neues Quiz</button></div></div>`;

 document.getElementById('again').onclick=()=>{startQuiz();};
}
function drawStatic(cv,L){
 prepare(L);const w=cv.parentElement.clientWidth,h=Math.round(Math.min(320,Math.max(220,w*.56))),dpr=window.devicePixelRatio||1;
 cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+'px';const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
 const save={ctx:P.ctx,W:P.W,H:P.H,L:P.L,t:P.t,tl:P.tl,cv:P.cv},z=QZ[L.id];
 Object.assign(P,{ctx,W:w,H:h,L,t:10,tl:{cseg:[{t0:0,t1:1,from:0,to:L.data.length}],ovs:z?[{o:{t:'zone',i1:z[0],i2:z[1],col:'#c9d2de'},t0:0,t1:1}]:[],steps:[]}});
 ctx.fillStyle=C.bg;ctx.fillRect(0,0,w,h);drawChart();Object.assign(P,save);
}

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function pill(ctx,x,y,text,col,alpha=1,align='center',W=P.W){
 if(alpha<=0)return;ctx.save();ctx.globalAlpha=alpha;ctx.font=`700 11px ${MONO}`;
 const w=ctx.measureText(text).width+14,h=20;let x0=align==='center'?x-w/2:align==='left'?x:x-w;
 x0=Math.max(2,Math.min(W-w-2,x0));const y0=y-h/2;
 ctx.fillStyle='rgba(2,4,7,.88)';rr(ctx,x0,y0,w,h,5);ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=1.2;ctx.stroke();
 ctx.fillStyle=col;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(text,x0+7,y+.5);ctx.restore();
}
function arrowHead(ctx,x1,y1,x2,y2,col){const a=Math.atan2(y2-y1,x2-x1),s=8;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-s*Math.cos(a-.45),y2-s*Math.sin(a-.45));ctx.lineTo(x2-s*Math.cos(a+.45),y2-s*Math.sin(a+.45));ctx.closePath();ctx.fill();}

function drawChart(){
 const {ctx,W,H,L,t}=P,d=L.data,n=d.length,v=visibleAt(t),vi=Math.floor(v),fr=v-vi;
 const panel=L.panel,ph=panel?118:0;
 const left=8,right=W-54,top=22,mainB=H-ph-(panel?26:22);
 let lo=L.lo,hi=L.hi;const pad=(hi-lo)*.1;lo-=pad;hi+=pad;
 const cw=(right-left)/n,X=i=>left+(i+.5)*cw,Y=p=>top+(hi-p)/(hi-lo)*(mainB-top);
 const g={ctx,X,Y,cw,top,mainB,left,right,n,v,vi,d,W};
 // Raster
 const rawStep=(hi-lo)/5,mag=Math.pow(10,Math.floor(Math.log10(rawStep)));const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=rawStep);
 ctx.font=`500 10.5px ${MONO}`;ctx.textBaseline='middle';ctx.textAlign='left';
 for(let p=Math.ceil(lo/step)*step;p<=hi;p+=step){const y=Y(p);ctx.strokeStyle=C.grid;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();ctx.fillStyle=C.axis;ctx.fillText(fmt(p,step<1?1:0),right+8,y);}
 ctx.strokeStyle='#1b2532';ctx.beginPath();ctx.moveTo(right,top-10);ctx.lineTo(right,mainB+8);ctx.stroke();
 // Overlays (hinten)
 const act=P.tl.ovs.filter(x=>t>=x.t0).map(x=>({o:x.o,p:clamp((t-x.t0)/(x.t1-x.t0))}));
 act.filter(a=>['zone','band','fib','pos'].includes(a.o.t)).forEach(a=>drawOv(g,a.o,ease(a.p),'back'));
 // Kerzen
 const bw=Math.max(2,Math.min(16,cw*.66));
 const cnt=Math.min(n,vi+(fr>0.01?1:0));
 for(let i=0;i<cnt;i++){
  let {o,h,l,c}=d[i];
  if(i===vi){const f=ease(fr);const cc=o+(c-o)*f;h=Math.max(o,cc)+(h-Math.max(o,c))*f;l=Math.min(o,cc)-(Math.min(o,c)-l)*f;c=cc;}
  const col=c>=o?C.up:C.down,x=X(i);
  ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,Math.min(1.6,cw*.12));ctx.beginPath();ctx.moveTo(x,Y(h));ctx.lineTo(x,Y(l));ctx.stroke();
  const y1=Y(Math.max(o,c)),y2=Y(Math.min(o,c));ctx.fillStyle=col;ctx.fillRect(x-bw/2,y1,bw,Math.max(1.2,y2-y1));
 }
 // aktueller Preis
 if(cnt>0){const i=cnt-1;const c=i===vi?d[i].o+(d[i].c-d[i].o)*ease(fr):d[i].c;const col=c>=d[i].o?C.up:C.down,y=Y(c);
  ctx.save();ctx.setLineDash([2,3]);ctx.strokeStyle=hexA(col,.7);ctx.beginPath();ctx.moveTo(X(i)+bw/2,y);ctx.lineTo(right,y);ctx.stroke();ctx.restore();
  ctx.fillStyle=col;rr(ctx,right+2,y-9,W-right-4,18,4);ctx.fill();ctx.fillStyle='#02130c';ctx.font=`800 10.5px ${MONO}`;ctx.fillText(fmt(c),right+7,y+.5);}
 // Overlays (vorne)
 act.filter(a=>!['zone','band','fib','pos'].includes(a.o.t)).forEach(a=>drawOv(g,a.o,ease(a.p),'front'));
 act.filter(a=>a.o.t==='fib').forEach(a=>drawOv(g,a.o,ease(a.p),'front'));
 // Panel
 if(panel){const pt=mainB+38,pb=H-10;ctx.strokeStyle='#1b2532';ctx.beginPath();ctx.moveTo(0,mainB+13);ctx.lineTo(W,mainB+13);ctx.stroke();
  ctx.font=`700 10.5px ${MONO}`;ctx.textAlign='left';
  if(panel==='rsi'){const Y2=x=>pt+(100-x)/100*(pb-pt);
   ctx.fillStyle=hexA(C.purple,.06);ctx.fillRect(left,Y2(70),right-left,Y2(30)-Y2(70));
   [[70,C.down,'70 ÜBERKAUFT'],[30,C.up,'30 ÜBERVERKAUFT']].forEach(([lv,col,tx])=>{ctx.save();ctx.setLineDash([4,4]);ctx.strokeStyle=hexA(col,.7);ctx.beginPath();ctx.moveTo(left,Y2(lv));ctx.lineTo(right,Y2(lv));ctx.stroke();ctx.restore();ctx.fillStyle=col;ctx.fillText(String(lv),right+8,Y2(lv));ctx.globalAlpha=.75;ctx.fillText(tx.slice(3),left+4,Y2(lv)+(lv===70?-8:9));ctx.globalAlpha=1;});
   const r=L.rsi;ctx.lineWidth=1.8;ctx.strokeStyle=C.purple;ctx.beginPath();let st=false;
   for(let i=0;i<cnt;i++){if(r[i]==null)continue;const y=Y2(r[i]);if(!st){ctx.moveTo(X(i),y);st=true}else ctx.lineTo(X(i),y);}ctx.stroke();
   // Extrembereiche einfärben
   for(let i=1;i<cnt;i++){if(r[i]==null)continue;if(r[i]>70||r[i]<30){ctx.fillStyle=r[i]>70?hexA(C.down,.5):hexA(C.up,.5);ctx.beginPath();ctx.arc(X(i),Y2(r[i]),2.2,0,7);ctx.fill();}}
   ctx.fillStyle=C.purple;ctx.fillText('RSI (14)',left+4,pt-6);
  } else {const mv=Math.max(...d.map(c=>c.v));
   for(let i=0;i<cnt;i++){const c=d[i],hgt=(pb-pt)*c.v/mv*(i===vi?ease(fr):1);ctx.fillStyle=hexA(c.c>=c.o?C.up:C.down,c.v>mv*.5?.95:.5);ctx.fillRect(X(i)-bw/2,pb-hgt,bw,hgt);}
   ctx.fillStyle=C.axis;ctx.fillText('VOLUMEN',left+4,pt-6);}
 }
}

function drawOv(g,o,p,layer){
 const {ctx,X,Y,cw}=g,col=o.col||C.gold;
 switch(o.t){
 case 'line':{const ext=o.ext||0,sl=(o.b[1]-o.a[1])/(o.b[0]-o.a[0]);const x1=X(o.a[0]),y1=Y(o.a[1]),x2=X(o.b[0]+ext),y2=Y(o.b[1]+sl*ext);
  const xe=x1+(x2-x1)*p,ye=y1+(y2-y1)*p;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.shadowColor=col;ctx.shadowBlur=6;if(o.dash)ctx.setLineDash([6,5]);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(xe,ye);ctx.stroke();ctx.restore();
  dot(ctx,x1,y1,col);if(p>.4)dot(ctx,X(o.b[0]),Y(o.b[1]),col);
  if(o.label)pill(ctx,xe,ye-16,o.label,col,clamp((p-.75)/.25));break;}
 case 'h':{const x1=X(o.from??0)-cw/2,x2=X(o.to??g.n-1)+cw/2,y=Y(o.p),xe=x1+(x2-x1)*p;
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash(o.dash?[3,4]:[8,5]);ctx.shadowColor=col;ctx.shadowBlur=5;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(xe,y);ctx.stroke();ctx.restore();
  if(o.label)pill(ctx,o.lab!=null?X(o.lab)-cw/2:x1+4,o.lpos==='below'?y+15:y-15,o.label,col,clamp((p-.3)/.4),'left');
  if(p>.95&&!o.noTag){ctx.fillStyle=col;rr(ctx,g.right+2,y-9,g.W-g.right-4,18,4);ctx.fill();ctx.fillStyle='#05080d';ctx.font=`800 10.5px ${MONO}`;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(fmt(o.p),g.right+7,y+.5);}
  break;}
 case 'zone':{const hi=hiR(g.d,o.i1,o.i2),lo=loR(g.d,o.i1,o.i2);const x1=X(o.i1)-cw*.85,x2=X(o.i2)+cw*.85,y1=Y(hi)-7,y2=Y(lo)+7;
  ctx.save();ctx.globalAlpha=p;ctx.fillStyle=hexA(col,.13);rr(ctx,x1,y1,x2-x1,y2-y1,6);ctx.fill();ctx.setLineDash([4,3]);ctx.strokeStyle=col;ctx.lineWidth=1.3;ctx.stroke();ctx.restore();
  if(o.label)pill(ctx,(x1+x2)/2,o.below?y2+16:y1-16,o.label,col,p);break;}
 case 'label':{const x=X(o.i),y=Y(o.p),below=o.pos==='below',off=(1-p)*8;const ly=below?y+26+off:y-26-off;
  ctx.save();ctx.globalAlpha=p;ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,below?y+4:y-4);ctx.lineTo(x,below?ly-10:ly+10);ctx.stroke();ctx.restore();
  pill(ctx,x,ly,o.text,col,p);break;}
 case 'pos':{const x1=X(o.i1)-cw/2,x2=x1+(X(o.i2)+cw/2-x1)*p,ye=Y(o.entry),ys=Y(o.stop);
  ctx.fillStyle=hexA(C.down,.22);ctx.fillRect(x1,ye,x2-x1,ys-ye);
  if(o.target!=null){const yt=Y(o.target);ctx.fillStyle=hexA(C.up,.2);ctx.fillRect(x1,yt,x2-x1,ye-yt);
   pill(ctx,x1+6,(yt+ye)/2,'CHANCE '+fmt(o.target-o.entry)+' €',C.up,clamp((p-.5)/.5),'left');}
  ctx.strokeStyle='#e6ecf3';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x1,ye);ctx.lineTo(x2,ye);ctx.stroke();
  pill(ctx,x1+6,(ye+ys)/2,'RISIKO '+fmt(o.entry-o.stop)+' €',C.down,clamp((p-.5)/.5),'left');
  if(o.target!=null)pill(ctx,x2-6,ye,'CRV 1 : '+fmt((o.target-o.entry)/(o.entry-o.stop)),'#e6ecf3',clamp((p-.8)/.2),'right');
  else pill(ctx,x2-6,ye,'EINSTIEG','#e6ecf3',clamp((p-.8)/.2),'right');
  break;}
 case 'mark':{const x=X(o.i),y=Y(o.p),below=o.pos==='below';ctx.save();ctx.globalAlpha=p;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y+(below?3:-3),3.5,0,7);ctx.fill();ctx.restore();
  pill(ctx,x,below?y+20:y-20,o.text,col,p);break;}
 case 'path':{const pts=o.pts.map(q=>[X(q[0]),Y(q[1])]);let tot=0;const seg=[];for(let i=1;i<pts.length;i++){const s=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(s);tot+=s;}
  let rem=tot*p;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.shadowColor=col;ctx.shadowBlur=6;ctx.beginPath();ctx.moveTo(...pts[0]);
  for(let i=1;i<pts.length&&rem>0;i++){const f=Math.min(1,rem/seg[i-1]);ctx.lineTo(pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f);rem-=seg[i-1];}ctx.stroke();ctx.restore();break;}
 case 'arrow':{const x1=X(o.a[0]),y1=Y(o.a[1]),x2=X(o.b[0]),y2=Y(o.b[1]),xe=x1+(x2-x1)*p,ye=y1+(y2-y1)*p;
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(xe,ye);ctx.stroke();ctx.restore();
  if(p>.05)arrowHead(ctx,x1,y1,xe,ye,col);
  if(o.label)pill(ctx,(x1+xe)/2+(Math.abs(x2-x1)<4?8:12),(y1+ye)/2,o.label,col,clamp((p-.5)/.5),'left');break;}
 case 'fib':{const lv=[0,.236,.382,.5,.618,.786,1],cols=['#8a96a8','#6f8fb8','#4c9aff',C.gold,C.gold,C.orange,'#8a96a8'];
  const pr=l=>o.p2-(o.p2-o.p1)*l,x1=X(o.i1)-cw/2,x2=g.right;
  if(layer==='back'){const gp=clamp((p-.75)/.25);if(gp>0){ctx.fillStyle=hexA(C.gold,.16*gp);ctx.fillRect(x1,Y(pr(.5)),x2-x1,Y(pr(.618))-Y(pr(.5)));}
   const dp=clamp(p*1.4);ctx.save();ctx.globalAlpha=.6*dp;ctx.strokeStyle='#8a96a8';ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(X(o.i1),Y(o.p1));ctx.lineTo(X(o.i1)+(X(o.i2)-X(o.i1))*dp,Y(o.p1)+(Y(o.p2)-Y(o.p1))*dp);ctx.stroke();ctx.restore();break;}
  lv.forEach((l,k)=>{const q=clamp(p*1.6-k*.09);if(q<=0)return;const y=Y(pr(l)),xe=x1+(x2-x1)*q;
   ctx.save();ctx.strokeStyle=cols[k];ctx.lineWidth=(l===.5||l===.618)?1.8:1.1;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(xe,y);ctx.stroke();ctx.restore();
   if(q>.9){ctx.save();ctx.globalAlpha=clamp((q-.9)*10);ctx.fillStyle=cols[k];rr(ctx,g.right+2,y-8,g.W-g.right-4,16,4);ctx.fill();ctx.fillStyle='#05080d';ctx.font=`800 10px ${MONO}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(fmt(l,3).replace(/0+$/,'').replace(/,$/,''),g.right+6,y+.5);ctx.restore();}});
  const gp=clamp((p-.8)/.2);if(gp>0)pill(ctx,x1+6,(Y(pr(.5))+Y(pr(.618)))/2,'GOLDEN ZONE',C.gold,gp,'left');break;}
 case 'sma':{const s=o._s,lim=Math.min(g.vi,Math.round((g.n-1)*p));ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.shadowColor=col;ctx.shadowBlur=4;ctx.beginPath();let st=false,lx=0,ly=0;
  for(let i=0;i<=lim&&i<s.length;i++){if(s[i]==null)continue;const x=X(i),y=Y(s[i]);if(!st){ctx.moveTo(x,y);st=true}else ctx.lineTo(x,y);lx=x;ly=y;}ctx.stroke();ctx.restore();
  if(st&&o.label)pill(ctx,lx-8,ly+(o.n<20?-16:18),o.label,col,clamp((p-.8)/.2),'right');break;}
 case 'cross':{if(o._i<0||g.vi<o._i)return;const x=X(o._i),y=Y(o._p);ctx.save();ctx.globalAlpha=p;ctx.strokeStyle=C.gold;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,9+(1-p)*14,0,7);ctx.stroke();ctx.restore();
  pill(ctx,x,y-34,'GOLDEN CROSS ✦',C.gold,p);break;}
 }
}
function dot(ctx,x,y,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,3.4,0,7);ctx.fill();ctx.strokeStyle='#020407';ctx.lineWidth=1.5;ctx.stroke();}

/* ---- Spezial: Anatomie einer Kerze (Stil wie Lern-Shorts) ---- */
function pathState(Pth,f){const pos=f*(Pth.length-1),i=Math.floor(pos),fr=pos-i;const cur=i>=Pth.length-1?Pth[Pth.length-1]:Pth[i]+(Pth[i+1]-Pth[i])*ease(fr);
 let h=Math.max(Pth[0],cur),l=Math.min(Pth[0],cur);for(let k=0;k<=Math.min(i,Pth.length-1);k++){h=Math.max(h,Pth[k]);l=Math.min(l,Pth[k]);}return{o:Pth[0],c:cur,h,l};}
function drawAnatomy(){
 const {ctx,W,H,t}=P;const lo=91,hi=115,top=70,bot=H-56;const Y=p=>top+(hi-p)/(hi-lo)*(bot-top);
 const G=[100,98.5,96,97.5,101,104,102.5,108,112,109.5,107],R=[107,109,111,108.5,104,101.5,99,94,96,97];
 const red=t>=13300,Pth=red?R:G,f=red?clamp((t-13800)/5600):clamp((t-900)/6000);
 const fade=red?clamp((t-13300)/500):1;
 // Titel
 ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle=C.mute;ctx.font=`500 ${W<420?10:11}px ${MONO}`;ctx.fillText('CHART-SCHULE · KERZE',W/2,22);
 ctx.fillStyle=C.text;ctx.font=`800 ${W<420?22:28}px ${MONO}`;ctx.fillText('ANATOMIE',W/2,50);
 ctx.fillStyle=C.mute;ctx.font=`500 ${W<420?10.5:12}px ${MONO}`;ctx.fillText(red?'(ROTE KERZE)':'(GRÜNE KERZE)',W/2,66);
 if(!red&&t<900){ctx.fillStyle=C.mute;ctx.font=`600 12px ${MONO}`;ctx.fillText('10:00 – 11:00 UHR',W/2,(top+bot)/2);return;}
 const s=pathState(Pth,f),up=s.c>=s.o,col=up?C.up:C.down,x=W*.5,bw=Math.min(70,Math.max(40,W*.13));
 ctx.globalAlpha=fade;
 // Docht + Körper
 ctx.strokeStyle=col;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,Y(s.h));ctx.lineTo(x,Y(s.l));ctx.stroke();
 const y1=Y(Math.max(s.o,s.c)),y2=Y(Math.min(s.o,s.c));ctx.fillStyle=col;ctx.fillRect(x-bw/2,y1,bw,Math.max(2,y2-y1));
 // Preis-Punkt
 if(f<1){const py=Y(s.c);ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=14;ctx.fillStyle='#f4f7fb';ctx.beginPath();ctx.arc(x,py,7,0,7);ctx.fill();ctx.restore();
  ctx.save();ctx.setLineDash([3,4]);ctx.strokeStyle='rgba(244,247,251,.45)';ctx.beginPath();ctx.moveTo(x+bw/2+6,py);ctx.lineTo(W-6,py);ctx.stroke();ctx.restore();
  ctx.fillStyle='#f4f7fb';ctx.font=`800 11px ${MONO}`;ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText('PREIS '+fmt(s.c),W-8,py-4);
  const startH=red?11:10,min=Math.floor(f*60);ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle=C.gold;ctx.font=`700 13px ${MONO}`;
  ctx.fillText(`⏱ ${String(startH).padStart(2,'0')}:${String(min).padStart(2,'0')} UHR`,W/2,H-22);}
 else{ctx.textAlign='center';ctx.fillStyle=col;ctx.font=`800 ${W<420?14:17}px ${MONO}`;ctx.fillText(up?'▲ BULLISCH – KÄUFER GEWINNEN':'▼ BÄRISCH – VERKÄUFER GEWINNEN',W/2,H-22);}
 // Beschriftungen rechts (gestrichelte Linien)
 const base=red?19600:7200,lab=(i)=>clamp((t-base-i*380)/400);
 const fs=W<420?12:15,lx=x+bw/2+(W<420?50:80);
 const right=(p,txt,c,i,fromX)=>{const a=lab(i);if(a<=0)return;ctx.save();ctx.globalAlpha=a*fade;ctx.setLineDash([6,5]);ctx.strokeStyle=c;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(fromX+4,Y(p));ctx.lineTo(fromX+4+(lx-fromX-12)*a,Y(p));ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=c;ctx.font=`800 ${fs}px ${MONO}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(txt,lx,Y(p));ctx.restore();};
 if(f>=1){
  right(s.h,'HOCH',C.up,0,x);
  right(red?s.o:s.c,red?'ERÖFFNUNG':'SCHLUSS','#e6ecf3',1,x+bw/2);
  right(red?s.c:s.o,red?'SCHLUSS':'ERÖFFNUNG','#e6ecf3',2,x+bw/2);
  right(s.l,'TIEF',C.down,3,x);
  // links: Docht / Körper (gelb)
  const kb=red?clamp((t-21300)/500):clamp((t-9300)/500),db=red?clamp((t-21800)/500):clamp((t-9900)/500);
  const bx=x-bw/2-12;ctx.save();ctx.strokeStyle=C.gold;ctx.fillStyle=C.gold;ctx.lineWidth=2.4;ctx.font=`800 ${fs}px ${MONO}`;ctx.textAlign='right';ctx.textBaseline='middle';
  if(kb>0){ctx.globalAlpha=kb*fade;ctx.beginPath();ctx.moveTo(bx+8,y1);ctx.lineTo(bx,y1);ctx.lineTo(bx,y2);ctx.lineTo(bx+8,y2);ctx.stroke();ctx.fillText('KÖRPER',bx-8,(y1+y2)/2);}
  if(db>0){ctx.globalAlpha=db*fade;ctx.fillText('DOCHT',x-10,(Y(s.h)+y1)/2);ctx.fillText('DOCHT',x-10,(Y(s.l)+y2)/2);}
  ctx.restore();
 }
 // Eröffnungs-Markierung während der Entstehung
 if(f<1){ctx.save();ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(230,236,243,.35)';ctx.beginPath();ctx.moveTo(x-bw/2-40,Y(s.o));ctx.lineTo(x-bw/2-4,Y(s.o));ctx.stroke();ctx.restore();
  ctx.fillStyle='rgba(230,236,243,.7)';ctx.font=`700 10.5px ${MONO}`;ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText('ERÖFFNUNG',x-bw/2-6,Y(s.o)-3);}
 ctx.globalAlpha=1;
}

/* ---- Schleife ---- */
function frame(ts){
 const dt=P.last?Math.min(60,ts-P.last):0;P.last=ts;
 if(P.L&&P.cv){
  if(P.playing){P.t+=dt*P.speed;if(P.t>=P.tl.total){P.t=P.tl.total;P.playing=false;updBtn();markSeen(P.L.id);}P.dirty=true;}
  if(P.dirty){
   const {ctx,W,H}=P;ctx.clearRect(0,0,W,H);ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
   if(P.L.custom)drawAnatomy();else drawChart();
   const sk=document.getElementById('seek');if(sk)sk.value=P.t;
   let si=0;P.tl.steps.forEach((s,i)=>{if(P.t>=s.t)si=i;});
   if(si!==P.stepIdx){P.stepIdx=si;const cp=document.getElementById('captxt');cp.style.opacity=0;setTimeout(()=>{cp.textContent=P.tl.steps[si].text;cp.style.opacity=1;},120);
    document.getElementById('stepno').textContent=`SCHRITT ${si+1} / ${P.tl.steps.length}`;
    document.querySelectorAll('.chip').forEach((c,i)=>{c.classList.toggle('on',i===si);c.classList.toggle('done',i<si);});}
   P.dirty=false;
  }
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>P.dirty=true);

function route(){const id=location.hash.slice(1);if(id==='quiz')startQuiz();else if(id.startsWith('kat-'))showCat(id.slice(4));else if(id)openLesson(id);else showHome();}
window.addEventListener('hashchange',route);
updProg();route();
</script>
